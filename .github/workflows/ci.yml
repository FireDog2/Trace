name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: portfolio
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PORTFOLIO_POSTGRES_DSN: postgresql://portfolio:portfolio@localhost:5432/portfolio
      TEST_POSTGRES_DSN: postgresql://portfolio:portfolio@localhost:5432/portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: web/package-lock.json }
      - run: python -m pip install -e ".[dev]"
      - run: npm --prefix web ci
      - run: psql "$PORTFOLIO_POSTGRES_DSN" -f tests/fixtures/postgres_business_review.sql
      - run: python -m pytest -v
      - run: npm --prefix web test -- --run
      - run: npm --prefix web run build
