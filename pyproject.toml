[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-analysis-agent"
version = "0.1.0"
description = "A local-first, traceable data analysis agent workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    "plotly>=5.24,<7",
    "polars>=1.12,<2",
    "pydantic>=2.9,<3",
    "python-multipart>=0.0.12,<1",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[project.scripts]
data-analysis-agent = "data_analysis_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/data_analysis_agent"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
