[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-analysis-agent"
version = "0.1.0"
description = "A local-first, traceable data analysis agent workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    "plotly>=5.24,<7",
    "polars>=1.12,<2",
    "pypdf>=6,<7",
    "pydantic>=2.9,<3",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.12,<1",
    "reportlab>=4.2,<5",
    "sqlglot>=27,<28",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3,<3",
    "pytest>=8.3,<9",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16,<1",
]

[project.scripts]
data-analysis-agent = "data_analysis_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/data_analysis_agent"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider --basetemp=.pytest-tmp"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src/data_analysis_agent"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["data_analysis_agent"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
